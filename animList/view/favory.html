<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnimList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">


</head>
<body>

    <!-- HEADER-->

    <header data-bs-theme="dark">
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
          <div class="container-fluid">
            <a class="navbar-brand" href="#">AnimList</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
              <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                  <a class="nav-link"  href="../index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#">Favoris</a>
                </li>
              </ul>
              <!--<ul class="navbar-nav mb-2 mb-md-0 d-flex">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#">Favoris</a>
                </li>
              </ul>-->
            </div>
          </div>
        </nav>
      </header>

    <section class="py-5 my-5 container">
        <div class="row justify-content-center">
            <div id="listAnime" class="col col-sm-10">


                <div class="card mb-3"  >
                    <div class="row" >
                        <div class="col-md-2">
                            <img src="https://cdn.myanimelist.net/images/anime/1553/137717l.jpg" class="card-img" alt="...">
                        </div>
                        <div class="col-md-6">
                            <div class="card-body">
                                <h5 class="card-title">Card title</h5>
                                <p class="card-text">
                                    <p>Current episode : </p>
                                    <div class="input-group ">
                                        <input type="number" value="150" class="form-control" placeholder="Current episode" aria-label="Current episode" aria-describedby="basic-addon2">
                                        <div class="input-group-append">
                                            <span class="input-group-text" id="basic-addon2">/X episodes</span>
                                        </div>
                                    </div>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="pt-4">
                                <div></div>
                                <button type="button" class="btn btn-primary">Primary</button>
                                
                            </div>
                        </div>

                    </div>
                </div>


            </div>
        </div>
    </section>
      


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="../model/anime.js"></script>
    <script src="../service/create_card.js"></script>
    <script src="../controller/favoryController.js"></script>

</body>
</html>
