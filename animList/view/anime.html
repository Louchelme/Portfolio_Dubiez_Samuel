<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>AnimList</title>
</head>
<body  >
    <!-- navbar -->
    <header data-bs-theme="dark">
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">AnimList</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link"  href="../index.html">Rechercher</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./favory.html">Favoris</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!--contenue-->
    <main class="container mt-5 pt-3">
        <div class="row">
            <!-- left -->
            <div class="col-lg-6">
                <!-- Post content-->
                <article>
                    <div class="mb-4">
                        <!-- default titles-->
                        <h1 id="titles" class="fw-bolder mb-1"></h1>
                        <!-- score -->
                        <div id="popularity" class="badge bg-secondary text-decoration-none link-light">Score : 1</div>
                        <div id="rank" class="badge bg-secondary text-decoration-none link-light">Rank : 1</div>
                    </div>
                    <!-- Preview image anime-->
                    <figure class="mb-4"><img id="image" class="img-fluid rounded" src="" alt="..."></figure>
                </article>
            </div>
            <!-- right -->
            <div class="col-lg-4">
                <!-- Anime -->
                <div class="card mb-4">
                    <div class="card-header">Anime</div>
                    <div class="card-body">
                        <!-- type + rating + genres + status + durée episode + total epidose-->
                        <div class="row">
                            <p class="col-sm-5 mb-0">Type :</p>
                            <p id="type" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Age :</p>
                            <p id="rating" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Genres :</p>
                            <p id="genres" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Episodes :</p>
                            <p id="nb_episode" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Durée :</p>
                            <p id="duration" class="col-sm-6 mb-0"></p>
                        </div>
                    </div>
                </div>
                <!-- sortie -->
                <div class="card mb-4">
                    <div class="card-header">Parution</div>
                    <div class="card-body">
                        <!-- sortie + airing + aired -->
                        <div class="row">
                            <p class="col-sm-5 mb-0">Sortie :</p>
                            <p id="sortie" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Statue :</p>
                            <p id="status" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">période :</p>
                            <p id="aired" class="col-sm-6 mb-0"></p>
                        </div>
                    </div>
                </div>
                <!-- production -->
                <div class="card mb-4">
                    <div class="card-header">Informations</div>
                    <div class="card-body">
                        <!-- producters + studios + licensers -->
                        <div class="row">
                            <p class="col-sm-5 mb-0">Studios :</p>
                            <p id="Studio" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Porducteurs :</p>
                            <p id="producters" class="col-sm-6 mb-0"></p>
                        </div>
                        <div class="row">
                            <p class="col-sm-5 mb-0">Licenciers :</p>
                            <p id="licensers" class="col-sm-6 mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- synopsis -->
        <section class="mb-5">
            <h2 class="fw-bolder mb-4 mt-5">Synopsis</h2>
            <p id="synopsis" class="fs-5 mb-4"></p>
        </section>
    </main>>
    
    <!-- Footer -->
	<footer class="text-center text-lg-start text-muted">

		<!-- Copyright -->
		<div class="text-center p-4" style="background-color: rgba(0, 0, 0, 0.05);">
			©Copyright:
			<a class="text-reset fw-bold" href="#">SamSam.com</a>
		</div>
	</footer>
    

    <script src="../model/anime.js"></script>
    <script src="../service/api.js"></script>
	<script src="../controller/animeContoller.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>
</body>
</html>
